<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Sistemas - Inicio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contenedor {
            text-align: center;
            color: white;
            animation: aparecer 0.8s ease;
        }

        .icono-principal {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: girar 3s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .btn-inicio {
            display: inline-block;
            padding: 16px 40px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .btn-inicio:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes girar {
            0%, 100% { transform: rotateY(0deg) scale(1); }
            50% { transform: rotateY(180deg) scale(1.1); }
        }

        .elementos-decorativos {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .circulo {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: flotar 15s ease-in-out infinite;
        }

        .circulo-1 {
            width: 200px;
            height: 200px;
            top: -50px;
            left: -50px;
        }

        .circulo-2 {
            width: 150px;
            height: 150px;
            bottom: -30px;
            right: -30px;
            animation-delay: 5s;
        }

        @keyframes flotar {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }
    </style>
</head>
<body>
    <div class="elementos-decorativos">
        <div class="circulo circulo-1"></div>
        <div class="circulo circulo-2"></div>
    </div>

    <div class="contenedor">
        <div class="icono-principal">🎓</div>
        <h1>Quiz de Sistemas</h1>
        <p>Pon a prueba tus conocimientos en tecnología</p>
        <a href="login.html" class="btn-inicio">Comenzar Quiz</a>
    </div>
</body>
</html>
