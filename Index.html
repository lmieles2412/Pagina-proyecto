<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Sistemas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Toggle de tema -->
    <button id="btn-toggle-tema" class="toggle-tema" aria-label="Cambiar tema">
        <span class="icono-tema">🌙</span>
    </button>

    <div class="container">
        <!-- VISTA 1: EL LOBBY -->
        <section id="vista-lobby">
            <h1>Bienvenido al Quiz de Sistemas</h1>
            <p>Selecciona una categoría para comenzar:</p>
            
            <div class="categorias-grid">
                <!-- Nueva: Sistemas Operativos -->
<div class="card-categoria" data-categoria="sistemas">
    <span class="icono">💽</span>
    <h3>Sistemas Operativos</h3>
    <button class="btn-comenzar">Empezar Quiz</button>
</div>

<!-- Nueva: Ciberseguridad -->
<div class="card-categoria" data-categoria="seguridad">
    <span class="icono">🛡️</span>
    <h3>Ciberseguridad</h3>
    <button class="btn-comenzar">Empezar Quiz</button>
</div>

<!-- Nueva: Software -->
<div class="card-categoria" data-categoria="software">
    <span class="icono">📂</span>
    <h3>Software</h3>
    <button class="btn-comenzar">Empezar Quiz</button>
</div>
                <div class="card-categoria" data-categoria="hardware">
                    <span class="icono">🖥️</span>
                    <h3>Hardware</h3>
                    <button class="btn-comenzar">Empezar Quiz</button>
                </div>

                <div class="card-categoria" data-categoria="redes">
                    <span class="icono">🌐</span>
                    <h3>Redes</h3>
                    <button class="btn-comenzar">Empezar Quiz</button>
                </div>

                <div class="card-categoria" data-categoria="python">
                    <span class="icono">🐍</span>
                    <h3>Python</h3>
                    <button class="btn-comenzar">Empezar Quiz</button>
                </div>
            </div>
        </section>

        <!-- VISTA 2: EL JUEGO -->

        <section id="vista-juego" style="display: none;">
            <header class="header-juego">
                
<div class="barra-progreso-fondo">
    <div id="barra-progreso-relleno"></div>
</div>
                <button id="btn-volver">← Volver al Lobby</button>
                <div class="info-superior">
                    <span id="nombre-categoria">CATEGORÍA</span>
                    <div class="puntaje-mini">Puntos: <span id="puntaje">0</span></div>
                </div>
            </header>

            <div id="contenedor-preguntas"></div>

            <div id="resultado-final" style="display:none;" class="pregunta-card">
                <h3>¡Quiz Completado!</h3>
                <p id="mensaje-puntos"></p>
                <button id="btn-final-volver" class="btn-comenzar">Volver al Inicio</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
